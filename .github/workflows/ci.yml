name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy mylocker/app/core

      - name: Security scan with Bandit
        run: |
          bandit -r mylocker -ll -ii

      - name: Run Pytest Suite (including Windows tests)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: |
          python -m pytest mylocker/tests/ -v --tb=short

      - name: Build Single-File Executable with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalVault-Windows-x64
          path: dist/
          retention-days: 7
